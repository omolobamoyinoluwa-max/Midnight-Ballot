# Netlify deployment for the Midnight Ballot dApp.
#
# No SPA catch-all redirect on purpose: the app has a single route, and a
# `/* -> /index.html 200` rule would make a missing ZK artifact answer 200 with
# HTML instead of 404, which the Midnight SDK reports as a confusing
# "Expected ZK artifact, but received text/html".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The compiled circuit artifacts keep their extensions, so pin the MIME type.
# Populated into dist/zk/ballot by the midnight-ballot:zk-assets Vite plugin.
[[headers]]
  for = "/zk/ballot/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"

# Vite fingerprints everything under assets/, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

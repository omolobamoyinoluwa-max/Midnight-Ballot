name: Midnight Ballot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Compact launcher
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Pin the compiler, never "latest": compactc 0.31.1 emits language 0.23.0 /
      # runtime 0.16.0, matching @midnight-ntwrk/compact-runtime 0.16.0 here.
      # A newer compiler emits code for a newer runtime and fails every test
      # with "Version mismatch: compiled code expects <x>, runtime is 0.16.0".
      - name: Pin Compact compiler
        run: compact update 0.31.1

      - name: Verify Compact compiler
        run: compact --version

      - name: Compile contract
        run: npm run compile

      - name: Archive compiled circuits
        uses: actions/upload-artifact@v4
        with:
          name: compiled-circuits
          path: |
            contracts/managed/
            managed/

      - name: Run tests
        run: npm test

      # Type checks the Node toolchain and the browser dApp (separate tsconfigs),
      # then builds the dApp. Catches SDK/provider drift that unit tests cannot,
      # since `npm test` never imports the browser entry points.
      - name: Type check
        run: npm run typecheck

      - name: Build dApp
        run: npm run build:frontend
